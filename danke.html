<!doctype html>
<html lang="de">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1" />

  <title>Danke — The Realm</title>

  <!-- gleiche Fonts wie Hauptseite -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Cinzel+Decorative:wght@400;700&family=IM+Fell+English:ital@0;1&display=swap" rel="stylesheet">

  <style>
    body{
      margin:0;
      min-height:100vh;
      display:flex;
      align-items:center;
      justify-content:center;
      text-align:center;
      color:#2e3b33;
      font-family:system-ui, sans-serif;

      background:
        radial-gradient(900px 560px at 20% 10%, rgba(201,162,77,.25), transparent 60%),
        radial-gradient(900px 560px at 80% 30%, rgba(127,154,138,.18), transparent 60%),
        linear-gradient(180deg, #fbf6ec, #f2e7d1);
    }

    .box{
      background:rgba(255,255,255,.7);
      padding:40px;
      border-radius:22px;
      box-shadow:0 20px 50px rgba(0,0,0,.15);
      max-width:500px;
    }

    h1{
      font-family:"Cinzel Decorative", serif;
      font-size:42px;
      margin-bottom:12px;
    }

    p{
      font-family:"IM Fell English", serif;
      font-size:20px;
      color:#5f6f66;
    }

    .fun{
      margin-top:20px;
      font-size:18px;
      font-style:italic;
    }

    .avatar{
      margin-top:25px;
      width:120px;
      border-radius:18px;
      box-shadow:0 10px 30px rgba(0,0,0,.2);
      animation: floaty 5s ease-in-out infinite;
    }

    @keyframes floaty{
      0%{ transform:translateY(0); }
      50%{ transform:translateY(-8px); }
      100%{ transform:translateY(0); }
    }

    a{
      display:inline-block;
      margin-top:25px;
      text-decoration:none;
      color:#3b2f16;
      font-family:"Cinzel Decorative", serif;
      padding:10px 16px;
      border-radius:12px;
      background:linear-gradient(180deg, rgba(231,207,138,.7), rgba(201,162,77,.5));
    }

    a:hover{
      filter:brightness(1.05);
    }
  </style>
</head>

<body>
  <div class="box">
    <h1>Thank you, brave soul ✨</h1>

    <p>
      Your message has been received by the council.<br>
      Preparations for feasting and dancing are underway.
    </p>

    <p class="fun">
      We can’t wait to celebrate with you 🥂
    </p>

    <!-- dein Glubschaugen-Bild -->
    <img src="avatars.PNG" class="avatar" alt="Party creature" />

    <br>

    <a href="index.html">Return to the Realm</a>
  </div>
</body>
</html>
